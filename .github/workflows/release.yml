name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # build-app.sh derives CFBundleVersion from the commit count.
          fetch-depth: 0

      - name: Run tests
        run: swift test

      - name: Build DMG
        env:
          # The tag is the version of record; build-app.sh stamps it into
          # the bundle so the plist never has to be edited per release.
          REED_VERSION: ${{ github.ref_name }}
        run: ./Scripts/make-dmg.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/Reed.dmg \
            --title "${{ github.ref_name }}" \
            --generate-notes
