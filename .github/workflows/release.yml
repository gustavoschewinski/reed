name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build app
        run: ./Scripts/build-app.sh

      - name: Build DMG
        run: ./Scripts/make-dmg.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/Reed.dmg \
            --title "${{ github.ref_name }}" \
            --generate-notes
